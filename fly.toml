app = "jobpilot-browser-worker"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile.browser-worker"

[env]
  HEADLESS = "true"
  POLL_INTERVAL_MS = "5000"
  HEARTBEAT_INTERVAL_MS = "20000"

# Secrets (set via `fly secrets set`):
#   APP_URL=https://jobpilot-ai-sand.vercel.app
#   WORKER_TOKEN=<vercel WORKER_TOKEN value>
#   BROWSER_TIMEOUT_MS=120000

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[processes]
  app = "node browser-worker.mjs"