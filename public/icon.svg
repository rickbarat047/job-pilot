<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="appGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#087F68;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#045F53;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="112" fill="url(#appGradient)" filter="url(#shadow)"/>
  
  <!-- Glow accent top-left -->
  <ellipse cx="140" cy="140" rx="70" ry="50" fill="#FFFFFF" opacity="0.15"/>
  
  <!-- "J" lettermark -->
  <text x="256" y="300" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="280" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-4">J</text>
  
  <!-- Sparkle accent top-right -->
  <path d="M440 160 L430 170 L410 170 L420 180 L420 190 L430 180 L440 190 L450 180 L460 170 L440 170 Z" fill="#FDE68A"/>
  
  <!-- Bottom accent bar -->
  <rect x="160" y="440" width="192" height="12" rx="6" fill="#FFFFFF" opacity="0.15"/>
</svg>