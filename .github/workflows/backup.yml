name: Database backup

on:
  schedule:
    - cron: "0 3 * * 0" # Weekly Sunday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-backup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backup:
    name: Production PostgreSQL backup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Install dependencies
        run: npm ci
      - name: Fail closed if the PostgreSQL secret is missing
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::DATABASE_URL is not configured. Refusing to fall back to SQLite. Add a PostgreSQL DATABASE_URL secret to this repository."
            exit 1
          fi
      - name: Back up PostgreSQL and verify the dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: "true"
        run: node scripts/backup-db.mjs --out ./backups
      - name: Upload backup and manifest
        uses: actions/upload-artifact@v4
        with:
          name: jobpilot-db-backup-${{ github.run_id }}
          path: ./backups/**
          retention-days: 30
          if-no-files-found: error
          compression-level: 9

  verify-isolated-restore:
    name: Verify restore in a disposable PostgreSQL database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jobpilot
          POSTGRES_PASSWORD: verification-only
          POSTGRES_DB: jobpilot_source
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobpilot -d jobpilot_source"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_SOURCE_URL: postgres://jobpilot:verification-only@127.0.0.1:5432/jobpilot_source?sslmode=disable
      TEST_RESTORE_URL: postgres://jobpilot:verification-only@127.0.0.1:5432/jobpilot_restore?sslmode=disable
      PGPASSWORD: verification-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Install dependencies
        run: npm ci
      - name: Create the disposable restore database
        run: psql -h 127.0.0.1 -U jobpilot -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE jobpilot_restore;"
      - name: Apply migrations and seed non-production test rows
        run: |
          psql -h 127.0.0.1 -U jobpilot -d jobpilot_source -v ON_ERROR_STOP=1 -f supabase/migrations/0001_schema.sql
          psql -h 127.0.0.1 -U jobpilot -d jobpilot_source -v ON_ERROR_STOP=1 -f supabase/migrations/0003_push_subscriptions.sql
          psql -h 127.0.0.1 -U jobpilot -d jobpilot_source -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO users (email, password_hash, name)
          VALUES ('backup-verify@example.test', 'verification-only', 'Backup Verification');
          INSERT INTO candidate_profiles (user_id, full_name, email)
          SELECT id, 'Backup Verification', 'backup-verify@example.test'
          FROM users WHERE email = 'backup-verify@example.test';
          INSERT INTO push_subscriptions (id, user_id, endpoint, p256dh, auth)
          SELECT 'backup-verify-sub', id, 'https://example.test/push', 'test-p256dh', 'test-auth'
          FROM users WHERE email = 'backup-verify@example.test';
          SQL
      - name: Back up the seeded source database
        env:
          DATABASE_URL: postgres://jobpilot:verification-only@127.0.0.1:5432/jobpilot_source?sslmode=disable
          DATABASE_SSL: "false"
        run: node scripts/backup-db.mjs --out ./verify-backups
      - name: Restore into the disposable database and verify integrity
        env:
          DATABASE_URL: postgres://jobpilot:verification-only@127.0.0.1:5432/jobpilot_source?sslmode=disable
          RESTORE_VERIFY_URL: postgres://jobpilot:verification-only@127.0.0.1:5432/jobpilot_restore?sslmode=disable
          RESTORE_VERIFY: "1"
          NODE_ENV: test
        run: |
          DUMP="$(find ./verify-backups -name '*.dump' -print -quit)"
          MANIFEST="$(find ./verify-backups -name '*.manifest.json' -print -quit)"
          test -n "$DUMP" && test -n "$MANIFEST"
          node scripts/verify-backup.mjs --file "$DUMP" --manifest "$MANIFEST"
