name: Browser worker

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-worker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies from the committed lockfile
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers matching the lockfile
        run: npx playwright install chromium --with-deps
      - name: Run browser worker
        env:
          APP_URL: ${{ secrets.APP_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          HEADLESS: "true"
          ONE_SHOT: "1"
          POLL_INTERVAL_MS: "1000"
          # Scheduled one-shot worker: 10m cron + 10m job timeout + 10m grace.
          WORKER_ONLINE_WINDOW_MS: "1800000"
        run: node scripts/browser-worker.mjs
