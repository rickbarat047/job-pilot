# Fly.io deployment for the JobPilot Playwright worker.
# Rename `app` to a globally unique name, then:
#   fly launch --no-deploy --copy-config
#   fly secrets set APP_URL=https://your-app.vercel.app WORKER_TOKEN=...
#   fly deploy
app = "jobpilot-worker"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  ENABLE_POLLER = "true"
  POLL_INTERVAL_SECONDS = "15"
  HEADLESS = "true"
  DRY_RUN = "false"
  SCREENSHOT_DIR = "/tmp/jobpilot-screenshots"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
